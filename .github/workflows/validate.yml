name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check requirements.json is current
        run: |
          node scripts/gen-requirements.mjs
          git diff --exit-code .claude-plugin/requirements.json
      - name: Validate plugin structure
        run: node scripts/validate.mjs
